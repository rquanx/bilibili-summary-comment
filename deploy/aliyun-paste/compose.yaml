name: voxwing-paste

services:
  privatebin:
    image: privatebin:reader-ready
    pull_policy: never
    restart: unless-stopped
    mem_limit: 320m
    entrypoint: ["/bin/sh", "/usr/local/bin/aliyun-privatebin-start"]
    volumes:
      - ./data/privatebin:/srv/data
      - ./privatebin-start.sh:/usr/local/bin/aliyun-privatebin-start:ro
    networks:
      - paste

  kutt:
    # Offline import of the pinned upstream digest (recorded in README.md).
    image: kutt:3.2.6-pinned
    pull_policy: never
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ./kutt.env
    volumes:
      - ./data/kutt:/var/lib/kutt
    networks:
      - paste

  gateway:
    image: caddy:2.10.2-alpine
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks:
      - paste

networks:
  paste:
